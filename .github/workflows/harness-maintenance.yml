name: Harness Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate skills
        run: npm run skills:validate

      - name: Check harness cleanliness
        run: npm run cleanup:check
