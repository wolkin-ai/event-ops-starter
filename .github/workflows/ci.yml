name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eventops
          POSTGRES_PASSWORD: eventops_dev
          POSTGRES_DB: event_ops_ci
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U eventops -d event_ops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgresql://eventops:eventops_dev@127.0.0.1:5434/event_ops_ci?schema=public
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      AUTH_SECRET: ci-auth-secret-for-event-ops-starter
      AUTH_URL: http://127.0.0.1:3000
      LOG_LEVEL: info
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check PostgreSQL provider reachability
        run: npm run check:postgres -- --mode status

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run verification gates
        run: npm run verify:all

      - name: Run review suite
        run: npm run review:suite
